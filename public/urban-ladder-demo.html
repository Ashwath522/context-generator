<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urban Ladder Variant Demo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #2b2520;
      --muted: #70675f;
      --line: #ded8cf;
      --brand: #8b4a2f;
      --soft: #f7f4ef;
      --green: #1f6f5b;
      --surface: #fffaf1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #fff;
    }

    header {
      border-bottom: 1px solid var(--line);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      color: var(--brand);
    }

    .search {
      width: min(420px, 50vw);
      border: 1px solid var(--line);
      padding: 10px 12px;
      color: var(--muted);
    }

    main {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(340px, 440px);
      gap: 42px;
      padding: 28px 32px 48px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 16px;
    }

    .thumbs {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .thumb,
    .hero {
      border: 1px solid var(--line);
      background: var(--soft);
      overflow: hidden;
    }

    .thumb {
      aspect-ratio: 1;
    }

    .hero {
      aspect-ratio: 4 / 3;
      display: grid;
      place-items: center;
    }

    .table-art {
      width: 76%;
      height: 58%;
      position: relative;
    }

    .top {
      position: absolute;
      left: 6%;
      right: 6%;
      top: 18%;
      height: 38%;
      background: var(--surface);
      border: 2px solid rgba(0, 0, 0, .12);
      box-shadow: 0 18px 24px rgba(0, 0, 0, .08);
    }

    .leg {
      position: absolute;
      width: 10%;
      height: 42%;
      top: 50%;
      background: #434343;
    }

    .leg.left {
      left: 22%;
    }

    .leg.right {
      right: 22%;
    }

    .meta {
      display: grid;
      gap: 18px;
      align-content: start;
    }

    h1 {
      font-size: 24px;
      line-height: 1.25;
      margin: 0;
      font-weight: 700;
    }

    .byline {
      color: var(--muted);
      margin-top: -8px;
    }

    .label {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .swatches,
    .sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      font: inherit;
      cursor: pointer;
      background: #fff;
      border: 1px solid var(--line);
    }

    .swatch {
      width: 88px;
      min-height: 70px;
      display: grid;
      grid-template-rows: 34px 1fr;
      padding: 0;
      text-align: left;
    }

    .swatch span {
      font-size: 11px;
      line-height: 1.2;
      padding: 5px;
      color: var(--ink);
    }

    .size {
      min-width: 128px;
      min-height: 42px;
      padding: 10px 14px;
      color: var(--ink);
    }

    button.active {
      outline: 2px solid var(--green);
      border-color: var(--green);
    }

    .price {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      display: grid;
      gap: 4px;
    }

    .deal {
      font-size: 28px;
      font-weight: 700;
    }

    .mrp {
      color: var(--muted);
      text-decoration: line-through;
    }

    .summary {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      line-height: 1.6;
      color: #3c3833;
    }

    .tabs {
      grid-column: 1 / -1;
      border-top: 1px solid var(--line);
      padding-top: 22px;
      display: grid;
      gap: 18px;
    }

    .tabbar {
      display: flex;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }

    .tabbar button {
      border: 0;
      border-bottom: 3px solid transparent;
      padding: 12px 16px;
      color: var(--muted);
    }

    .tabbar button.active {
      outline: 0;
      border-bottom-color: var(--brand);
      color: var(--brand);
    }

    .content-panel {
      min-height: 180px;
      line-height: 1.6;
    }

    .copy-block {
      display: grid;
      gap: 14px;
      max-width: 880px;
    }

    .promise-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 14px;
      max-width: 900px;
    }

    .promise-card {
      border: 1px solid var(--line);
      padding: 16px;
      background: #fff;
    }

    .promise-card strong {
      display: block;
      margin-bottom: 6px;
    }

    .copy-block p {
      margin: 0;
    }

    .list-block {
      display: grid;
      gap: 10px;
      margin: 0;
      padding-left: 18px;
      max-width: 860px;
    }

    dl {
      display: grid;
      grid-template-columns: repeat(3, minmax(160px, 1fr));
      gap: 14px 24px;
      margin: 0;
    }

    dt {
      color: var(--muted);
      font-size: 13px;
      text-transform: capitalize;
    }

    dd {
      margin: 4px 0 0;
      font-weight: 700;
    }

    @media (max-width: 820px) {
      header {
        padding: 12px 16px;
      }

      .search {
        display: none;
      }

      main {
        grid-template-columns: 1fr;
        padding: 18px 16px 36px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .thumbs {
        grid-template-columns: repeat(4, 1fr);
        order: 2;
      }

      dl {
        grid-template-columns: 1fr;
      }

      .promise-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Urban Ladder</div>
    <div class="search">Search</div>
  </header>

  <main>
    <section class="gallery" aria-label="Product gallery">
      <div class="thumbs" id="thumbs"></div>
      <div class="hero">
        <div class="table-art" aria-hidden="true">
          <div class="top"></div>
          <div class="leg left"></div>
          <div class="leg right"></div>
        </div>
      </div>
    </section>

    <section class="meta">
      <h1 id="title"></h1>
      <div class="byline">By Urban Ladder</div>

      <div>
        <div class="label">Finish</div>
        <div class="swatches" id="finishOptions"></div>
      </div>

      <div>
        <div class="label">Seating Capacity</div>
        <div class="sizes" id="sizeOptions"></div>
      </div>

      <div class="price">
        <div>Today's Deal Price</div>
        <div class="deal" id="price"></div>
        <div><span class="mrp" id="mrp"></span> <span id="discount"></span></div>
      </div>

      <div class="summary" id="summary"></div>
    </section>

    <section class="tabs">
      <div class="tabbar">
        <button class="active" type="button" data-tab="description">Description</button>
        <button type="button" data-tab="specifications">Specifications</button>
        <button type="button" data-tab="care">Care & Maintenance</button>
        <button type="button" data-tab="warranty">Warranty</button>
        <button type="button" data-tab="returns">Returns</button>
        <button type="button" data-tab="quality">Quality Promise</button>
      </div>
      <div class="content-panel" id="tabPanel"></div>
    </section>
  </main>

  <script>
    const sizes = [
      { sp: '4-to-6', label: '4 to 6 Extendable', price: '₹39,999', mrp: '₹57,799', discount: '(31% OFF)' },
      { sp: '6-to-8', label: '6 to 8 Extendable', price: '₹49,999', mrp: '₹69,999', discount: '(29% OFF)' }
    ];

    const finishes = [
      { sv: 'black-marble-high-gloss', label: 'Black Marble High Gloss', color: '#1e1d1b', reason: 'adds contrast to bright dining rooms' },
      { sv: 'white-ceramic', label: 'White Ceramic', color: '#f2f0e9', reason: 'keeps compact dining corners feeling open' },
      { sv: 'white-high-gloss', label: 'White High Gloss', color: '#fffaf1', reason: 'suits clean, modern meal spaces' },
      { sv: 'white-marble-high-gloss', label: 'White Marble High Gloss', color: '#ece7de', reason: 'brings a refined look to family dining' }
    ];

    const params = new URLSearchParams(location.search);
    const state = {
      sp: params.get('sp') || '4-to-6',
      sv: params.get('sv') || 'white-high-gloss',
      tab: params.get('tab') || 'description'
    };

    function selectedSize() {
      return sizes.find((item) => item.sp === state.sp) || sizes[0];
    }

    function selectedFinish() {
      return finishes.find((item) => item.sv === state.sv) || finishes[2];
    }

    function updateUrl() {
      const nextParams = new URLSearchParams({ sp: state.sp, sv: state.sv, tab: state.tab });
      history.replaceState(null, '', `${location.pathname}?${nextParams.toString()}`);
    }

    function summaryJson() {
      const size = selectedSize();
      const finish = selectedFinish();
      const otherSizes = sizes.filter((item) => item.sp !== size.sp).map((item) => item.label);
      const otherFinishes = finishes.filter((item) => item.sv !== finish.sv).map((item) => item.label);

      return {
        1: 'The Caribu dining table blends everyday utility with a polished extendable design for flexible hosting. Its clean profile, smooth touch, and space-conscious use case are kept together in the summary as preferred.',
        2: `This is the ${size.label} size and is also available in ${otherSizes.join(', ')}.`,
        3: `This is the ${finish.label} finish, which ${finish.reason}, and it is also available in ${otherFinishes.join(', ')}.`
      };
    }

    function productJson() {
      const size = selectedSize();
      const finish = selectedFinish();
      const summary = summaryJson();

      return {
        description: {
          preferred_json: summary,
          summary: `${summary[1]} ${summary[2]} ${summary[3]}`,
          aesthetic_style: 'Clean, contemporary lines with a restrained dining-room presence.',
          texture: 'Smooth glass feel with a polished high-gloss impression.',
          best_use: 'Made for everyday meals and flexible hosting in compact or family dining spaces.'
        },
        specifications: {
          dimensions: size.sp === '4-to-6' ? '1.75 m L x 79.80 cm W x 75.20 cm H' : '2.15 m L x 79.80 cm W x 75.20 cm H',
          primary_material: 'Glass',
          secondary_material: 'Engineered Wood',
          seating_capacity: size.label,
          color_finish: finish.label,
          net_quantity: '1 N',
          assembly_required: 'Carpenter Assembly'
        },
        care_and_maintenance: {
          instructions: [
            'We recommend wiping the surface with a soft, dry cloth regularly.',
            'We recommend using coasters or mats under hot or wet items.',
            'We recommend cleaning spills promptly with a lightly damp cloth.'
          ],
          avoid: [
            "It's best to avoid harsh chemical cleaners.",
            "It's best to avoid dragging sharp or heavy objects across the surface."
          ]
        },
        warranty: {
          applicable: true,
          duration_months: 12,
          status_line: '**Yes**, it has a warranty of **12 months**.',
          points: [
            'Covers manufacturing defects under normal household use.',
            'Covers defects in material and workmanship as per policy.',
            'Excludes accidental damage, misuse, and normal wear.'
          ],
          link: 'https://example.com/warranty-policy-placeholder'
        },
        returns: {
          window_days: 'within **10 days**',
          condition: [
            'Item must be unused and in original condition.',
            'Original packaging and invoice must be retained.',
            'Return approval is subject to category policy.'
          ],
          policy_link: 'https://example.com/returns-policy-placeholder'
        },
        quality_promise: {
          statement: 'Every dining table product is checked for finish, fit, and everyday usability before it reaches your home.',
          highlights: [
            'Designed to feel dependable in daily use, with details reviewed for a cleaner ownership experience.',
            'Supported by a 12-month warranty, so the purchase feels considered after delivery too.',
            'Built for a properly finished setup with assembly handled as part of the ownership journey.'
          ],
          isi: {
            certified: false,
            label: 'ISI Certified',
            logo: 'static-asset-reference'
          }
        }
      };
    }

    function renderList(title, values) {
      return `<p><strong>${title}</strong></p><ul class="list-block">${values.map((value) => `<li>${value}</li>`).join('')}</ul>`;
    }

    function renderBold(text) {
      return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    }

    function renderDescription(item) {
      const json = item.description.preferred_json;
      return `
        <div class="copy-block">
          <p><strong>1.</strong> ${json[1]}</p>
          <p><strong>2.</strong> ${json[2]}</p>
          <p><strong>3.</strong> ${json[3]}</p>
        </div>
      `;
    }

    function renderSpecs(item) {
      return `<dl>${Object.entries(item.specifications).map(([key, value]) => `
        <div><dt>${key.replace(/_/g, ' ')}</dt><dd>${value}</dd></div>
      `).join('')}</dl>`;
    }

    function renderTabContent(item) {
      const qualityCards = item.quality_promise.highlights.map((value, index) => `
        <div class="promise-card">
          <strong>${['Checked Finish', 'Warranty Support', 'Setup Confidence'][index] || 'Quality Detail'}</strong>
          <span>${value}</span>
        </div>
      `).join('');
      const views = {
        description: renderDescription(item),
        specifications: renderSpecs(item),
        care: `<div class="copy-block">${renderList('Instructions', item.care_and_maintenance.instructions)}${renderList('Avoid', item.care_and_maintenance.avoid)}</div>`,
        warranty: `<div class="copy-block"><p>${renderBold(item.warranty.status_line)}</p>${renderList('Coverage', item.warranty.points)}</div>`,
        returns: `<div class="copy-block"><p>${renderBold(`Eligible ${item.returns.window_days}.`)}</p>${renderList('Condition', item.returns.condition)}</div>`,
        quality: `<div class="copy-block"><p>${item.quality_promise.statement}</p><div class="promise-grid">${qualityCards}</div><p>${item.quality_promise.isi.label}: ${item.quality_promise.isi.certified ? 'Yes' : 'No'}</p></div>`
      };
      document.getElementById('tabPanel').innerHTML = views[state.tab] || views.description;
    }

    function render() {
      const size = selectedSize();
      const finish = selectedFinish();
      const item = productJson();
      const json = item.description.preferred_json;

      document.documentElement.style.setProperty('--surface', finish.color);
      document.getElementById('title').textContent = `Caribu Glass ${size.label} Dining Table In ${finish.label} Finish`;
      document.getElementById('price').textContent = size.price;
      document.getElementById('mrp').textContent = `MRP ${size.mrp}`;
      document.getElementById('discount').textContent = size.discount;
      document.getElementById('summary').innerHTML = `${json[1]}<br>${json[2]}<br>${json[3]}`;

      document.getElementById('finishOptions').innerHTML = finishes.map((item) => `
        <button class="swatch ${item.sv === state.sv ? 'active' : ''}" type="button" data-sv="${item.sv}" aria-label="${item.label}">
          <div style="background:${item.color}"></div>
          <span>${item.label}</span>
        </button>
      `).join('');

      document.getElementById('sizeOptions').innerHTML = sizes.map((item) => `
        <button class="size ${item.sp === state.sp ? 'active' : ''}" type="button" data-sp="${item.sp}">${item.label}</button>
      `).join('');

      document.getElementById('thumbs').innerHTML = finishes.map((item) => `
        <button class="thumb ${item.sv === state.sv ? 'active' : ''}" type="button" data-sv="${item.sv}" aria-label="${item.label}" style="background:${item.color}"></button>
      `).join('');

      document.querySelectorAll('[data-tab]').forEach((button) => {
        button.classList.toggle('active', button.dataset.tab === state.tab);
      });

      renderTabContent(item);
      updateUrl();
    }

    document.addEventListener('click', (event) => {
      const sizeButton = event.target.closest('[data-sp]');
      const finishButton = event.target.closest('[data-sv]');
      const tabButton = event.target.closest('[data-tab]');
      if (sizeButton) state.sp = sizeButton.dataset.sp;
      if (finishButton) state.sv = finishButton.dataset.sv;
      if (tabButton) state.tab = tabButton.dataset.tab;
      if (sizeButton || finishButton || tabButton) render();
    });

    render();
  </script>
</body>
</html>
